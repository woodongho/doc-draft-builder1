<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수원대학교 행정 문서 초안 생성기</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/suwon-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-brand">
        <div class="logo-badge">
          <img src="{{ url_for('static', filename='images/suwon-logo.png') }}" alt="수원대학교 로고" class="brand-logo">
        </div>
        <div class="header-text">
          <h1>수원대학교 행정 문서 초안 생성기</h1>
          <p class="subtitle">문서 종류와 핵심 사실만 입력하면 Gemini가 업무 문서 초안을 작성해 줍니다.</p>
        </div>
      </div>
    </header>

    <main class="main-grid">
      <!-- 왼쪽: 입력 영역 -->
      <section class="card">
        <div class="card-header">
          <h2>1. 문서 정보 입력</h2>
          <button type="button" id="fillSampleBtn" class="btn-secondary">예시 채우기</button>
        </div>
        <form id="draftForm" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="docType">문서 종류 <span class="required">*</span></label>
              <select id="docType" name="doc_type" required>
                <option value="">-- 선택하세요 --</option>
                <option value="보도자료">보도자료</option>
                <option value="안내문">안내문</option>
                <option value="기안문">기안문</option>
                <option value="결과 보고">결과 보고</option>
                <option value="업무 메일">업무 메일</option>
              </select>
            </div>

            <div class="form-group">
              <label for="tone">어조</label>
              <select id="tone" name="tone">
                <option value="공식적">공식적</option>
                <option value="친근한">친근한</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="title">제목 <span class="required">*</span></label>
            <input type="text" id="title" name="title" placeholder="예: 2026학년도 2학기 장학금 신청 안내" required>
          </div>

          <div class="form-group">
            <label for="recipient">받는 사람</label>
            <input type="text" id="recipient" name="recipient" placeholder="예: 재학생 전체 / 각 단과대학 행정실">
          </div>

          <div class="facts-section">
            <div class="result-header">
              <h3>핵심 사실 카드 (5칸)</h3>
              <div class="result-actions">
                <button type="button" id="saveFactsBtn" class="btn-secondary">저장</button>
                <button type="button" id="loadFactsBtn" class="btn-secondary">불러오기</button>
              </div>
            </div>
            <div class="facts-grid">
              <div class="form-group">
                <label for="factDateTime">일시</label>
                <input type="text" id="factDateTime" name="date_time" placeholder="예: 2026. 11. 25.(수) 14:00">
              </div>

              <div class="form-group">
                <label for="factLocation">장소</label>
                <input type="text" id="factLocation" name="location" placeholder="예: 본관 2층 대회의실">
              </div>

              <div class="form-group">
                <label for="factTarget">대상</label>
                <input type="text" id="factTarget" name="target" placeholder="예: 학부 재학생">
              </div>

              <div class="form-group">
                <label for="factHowToApply">신청 방법</label>
                <input type="text" id="factHowToApply" name="how_to_apply" placeholder="예: 포털 시스템 온라인 신청">
              </div>

              <div class="form-group full-width">
                <label for="factContact">문의처</label>
                <input type="text" id="factContact" name="contact" placeholder="예: 학생지원팀 (02-1234-5678)">
              </div>
            </div>
            <p id="factsFeedback" class="copy-feedback" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label>프롬프트 방식 선택</label>
            <div class="radio-group">
              <label class="radio-card">
                <input type="radio" name="prompt_type" value="A" checked>
                <div>
                  <strong>Prompt A (기본)</strong>
                  <span class="radio-desc">입력 정보로 해당 문서를 바로 작성합니다.</span>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="prompt_type" value="B">
                <div>
                  <strong>Prompt B (행정 체크리스트)</strong>
                  <span class="radio-desc">6하원칙·공식 문체·문의처를 점검하고, 없는 내용은 [확인 필요]로 표시합니다.</span>
                </div>
              </label>
            </div>
          </div>

          <div id="errorMessage" class="alert-error" role="alert" hidden></div>

          <button type="submit" id="generateBtn" class="btn-primary">초안 생성</button>
        </form>
      </section>

      <!-- 오른쪽: 결과 영역 -->
      <section class="card result-card">
        <div class="result-header">
          <h2>2. 생성된 초안</h2>
          <div class="result-actions">
            <button type="button" id="copyBtn" class="btn-secondary" disabled>복사</button>
            <button type="button" id="downloadBtn" class="btn-secondary" disabled>.md 다운로드</button>
          </div>
        </div>

        <div id="loadingBox" class="loading-box" hidden>
          <span class="spinner"></span>
          <span>생성 중...</span>
        </div>

        <div class="view-tabs" role="tablist" aria-label="초안 보기 방식">
          <button type="button" id="previewTabBtn" class="tab-btn active" role="tab" aria-selected="true">미리보기 (읽기 편한 화면)</button>
          <button type="button" id="editTabBtn" class="tab-btn" role="tab" aria-selected="false">직접 수정</button>
        </div>

        <div id="draftPreview" class="draft-preview">
          <p class="preview-placeholder">왼쪽에서 정보를 입력하고 [초안 생성] 버튼을 누르면 여기에 보기 좋게 정리된 초안이 표시됩니다.</p>
        </div>

        <textarea id="draftOutput" class="draft-output" hidden placeholder="이곳에서 생성된 초안을 자유롭게 수정할 수 있습니다."></textarea>
        <p id="copyFeedback" class="copy-feedback" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
